<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI’s Blind Spots — sharing image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body { background: #f7f4ed; color: #262a2c; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    h1 {
      position: absolute; top: 80px; left: 72px; margin: 0;
      font: 400 100px/.99 Baskerville, Georgia, serif;
      letter-spacing: -3px;
    }
    h1 span { display: block; }
    .subtitle {
      position: absolute; top: 315px; left: 75px; margin: 0;
      font: 400 28px/1.35 Baskerville, Georgia, serif;
    }
    .subtitle span { display: block; }
    .mark { position: absolute; left: 695px; top: 59px; width: 465px; height: 465px; }
    .byline {
      position: absolute; left: 75px; bottom: 68px; width: 570px;
      padding-top: 20px; border-top: 1px solid #c5c2b9;
      font: 400 25px/1.4 "Helvetica Neue", Helvetica, sans-serif;
    }
    .byline p { margin: 0; }
    .affiliations { margin-top: 5px !important; color: #626b6b; font-size: 18px; }
  </style>
</head>
<body>
  <main class="card" aria-label="Sharing image for AI’s Blind Spots">
    <h1><span>AI’s</span><span>Blind Spots</span></h1>
    <p class="subtitle"><span>Comparative Advantage and</span><span>Wage Growth under Jagged AGI</span></p>
    <img class="mark" src="blind-spots-mark.svg" alt="Jagged AI frontier with teal comparative blind spots">
    <div class="byline">
      <p>Ahmad Lashkaripour</p>
      <p class="affiliations">Indiana University · CEPR · CESifo</p>
    </div>
  </main>
</body>
</html>
